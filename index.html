<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>⋆⃟ۣۜ᭪𝐁𝐧 𝐂𝐚𝐯𝐞</title>

  <!-- Fonte clean e elegante -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Ícones -->
  <script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
        url('bg.jpg') center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #eaeaea;
    }

    .container {
      width: 100%;
      max-width: 380px;
      padding: 30px 18px;
      text-align: center;
    }

    .name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 28px;
      opacity: 0.9;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      text-decoration: none;
      color: #eaeaea;
      background: rgba(10,10,14,0.85);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.35s ease;
      backdrop-filter: blur(6px);
    }

    .link i {
      font-size: 20px;
      width: 26px;
      color: #9a9aff;
    }

    .link span {
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .link:hover {
      transform: translateY(-3px);
      border-color: rgba(154,154,255,0.5);
      box-shadow: 0 0 25px rgba(154,154,255,0.2);
    }

    footer {
      margin-top: 30px;
      font-size: 11px;
      opacity: 0.25;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="name">⋆⃟ۣۜ᭪𝐁𝐧 𝐂𝐚𝐯𝐞</div>

    <div class="links">

      <a class="link" href="https://chat.whatsapp.com/SEU_LINK" target="_blank">
        <i class="fab fa-whatsapp"></i>
        <span>WhatsApp</span>
      </a>

      <a class="link" href="https://chat.whatsapp.com/SEU_LINK" target="_blank">
        <i class="fab fa-whatsapp"></i>
        <span>WhatsApp</span>
      </a>

      <a class="link" href="https://tiktok.com/@SEU_USER" target="_blank">
        <i class="fab fa-tiktok"></i>
        <span>TikTok</span>
      </a>

    </div>

    <footer>© Bn Cave</footer>

  </div>

</body>
</html>
