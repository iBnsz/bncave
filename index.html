<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bn Cave</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.95)),
    url('bg.jpg') center / cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.container {
  width: 100%;
  max-width: 460px;
  padding: 50px 22px;
  text-align: center;
}

/* Nome do site */
.name {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 45px;
  text-shadow: 0 0 25px rgba(140,140,255,0.35);
}

/* Links */
.links {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.link {
  text-decoration: none;
  background: rgba(10,10,16,0.95);
  border-radius: 22px;
  padding: 26px;
  display: flex;
  align-items: center;
  gap: 22px;
  transition: 0.35s;
  border: 1px solid rgba(255,255,255,0.05);
}

.link i {
  font-size: 34px;
  color: #9fa8ff;
  min-width: 36px;
}

/* Textos */
.text {
  text-align: left;
}

.title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 17px;
  margin-top: 6px;
  color: #b7baff;
  letter-spacing: 1px;
}

/* Hover */
.link:hover {
  transform: translateY(-6px);
  box-shadow: 0 0 35px rgba(120,120,255,0.35);
  border-color: rgba(120,120,255,0.6);
}

/* Rodapé */
footer {
  margin-top: 45px;
  font-size: 12px;
  opacity: 0.25;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

  <div class="name">Bn Cave</div>

  <div class="links">

    <!-- Grupo WhatsApp -->
    <a class="link" href="https://chat.whatsapp.com/K8kBRwONbhQ2W20W0FGoDN?mode=gi_t" target="_blank">
      <i class="fab fa-whatsapp"></i>
      <div class="text">
        <div class="title">Grupo WhatsApp</div>
        <div class="subtitle">𓍢ִ໋🀦 ZENIN ✮ Tky ˙˚</div>
      </div>
    </a>

    <!-- Private -->
    <a class="link" href="https://wa.me/557798073981" target="_blank">
      <i class="fab fa-whatsapp"></i>
      <div class="text">
        <div class="title">Private</div>
        <div class="subtitle">Bn syze</div>
      </div>
    </a>

    <!-- TikTok -->
    <a class="link" href="https://www.tiktok.com/@bnstay3_" target="_blank">
      <i class="fab fa-tiktok"></i>
      <div class="text">
        <div class="title">TikTok User</div>
        <div class="subtitle">bnstay3_</div>
      </div>
    </a>

  </div>

  <footer>© Bn Cave</footer>

</div>

</body>
</html>
