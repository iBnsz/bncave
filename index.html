<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bn Cave</title>

<!-- Fonte premium -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<!-- Ícones -->
<script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background:
    linear-gradient(
      rgba(0,0,0,0.75),
      rgba(0,0,0,0.92)
    ),
    url("bg.jpg") center/cover no-repeat fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

/* Container */
.container {
  width: 100%;
  max-width: 520px;
  padding: 60px 24px;
  text-align: center;
}

/* Título */
.name {
  font-size: 46px;
  font-weight: 800;
  letter-spacing: 5px;
  margin-bottom: 55px;
  text-shadow:
    0 0 25px rgba(120,120,255,0.45),
    0 0 50px rgba(120,120,255,0.25);
}

/* Links */
.links {
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Card */
.link {
  text-decoration: none;
  background: rgba(12,12,20,0.95);
  border-radius: 26px;
  padding: 30px;
  display: flex;
  align-items: center;
  gap: 26px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.35s ease;
  backdrop-filter: blur(10px);
}

/* Ícone */
.link i {
  font-size: 42px;
  color: #8f95ff;
  min-width: 46px;
}

/* Textos */
.text {
  text-align: left;
}

.title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 18px;
  margin-top: 6px;
  color: #9fa4ff;
  letter-spacing: 1px;
}

/* Hover */
.link:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow:
    0 0 40px rgba(120,120,255,0.45),
    inset 0 0 20px rgba(120,120,255,0.15);
  border-color: rgba(120,120,255,0.7);
}

/* Rodapé */
footer {
  margin-top: 55px;
  font-size: 12px;
  opacity: 0.25;
  letter-spacing: 3px;
}
</style>
</head>

<body>

<div class="container">

  <div class="name">Bn Cave</div>

  <div class="links">

    <!-- Grupo WhatsApp -->
    <a class="link" href="https://chat.whatsapp.com/K8kBRwONbhQ2W20W0FGoDN?mode=gi_t" target="_blank">
      <i class="fab fa-whatsapp"></i>
      <div class="text">
        <div class="title">Grupo WhatsApp</div>
        <div class="subtitle">𓍢ִ໋🀦 ZENIN ✮ Tky ˙˚</div>
      </div>
    </a>

    <!-- Private -->
    <a class="link" href="https://wa.me/557798073981" target="_blank">
      <i class="fab fa-whatsapp"></i>
      <div class="text">
        <div class="title">Private</div>
        <div class="subtitle">Bn syze</div>
      </div>
    </a>

    <!-- TikTok -->
    <a class="link" href="https://www.tiktok.com/@bnstay3_" target="_blank">
      <i class="fab fa-tiktok"></i>
      <div class="text">
        <div class="title">TikTok User</div>
        <div class="subtitle">bnstay3_</div>
      </div>
    </a>

  </div>

  <footer>© Bn Cave</footer>

</div>

</body>
</html>
