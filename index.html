<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bn Cave</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte elegante -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background:

    }

      font-weight: 700;
      margin-bottom: 32px;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 22px 18px;
      margin-bottom: 20px;
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.6);
    }

    .card h2 {
      font-size: 1.25rem;
      color: #2f46ff;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 0.95rem;
      color: #cfd6ff;
      letter-spacing: 0.6px;
    }

    footer {
      margin-top: 26px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>

</html>
