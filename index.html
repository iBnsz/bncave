body{

/* Container principal */

  width:100%;

/* Nome com efeito ghost glow */
.name{

  text-shadow:

/* Lista */

/* Card ghost premium */
.link{
  display:flex;
  align-items:center;
  gap:18px;
  padding:22px;
  border-radius:22px;
  background:rgba(18,18,28,0.65);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.06);
  text-decoration:none;
  color:#fff;
  transition:all .4s ease;
  position:relative;
  overflow:hidden;
}

/* brilho lateral */
.link::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(120,120,255,0.25),transparent);
  transition:.6s;
}

.link:hover::before{
  left:100%;
}

.link:hover{
  transform:translateY(-6px);
  box-shadow:
    0 0 30px rgba(120,120,255,0.4),
    0 0 70px rgba(120,120,255,0.15);
  border-color:rgba(140,140,255,0.5);
}

.link i{

/* Texto */

  letter-spacing:1px;
}

.subtitle{

  color:#c4c8ff;
  letter-spacing:.5px;
}

/* Footer */
footer{
  margin-top:50px;
  font-size:12px;
  opacity:.35;
  letter-spacing:2px;
